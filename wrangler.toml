name = "tooniboy-scraper"
main = "src/index.js"
compatibility_date = "2026-11-26"
workers_dev = true

[vars]
# Actual upstream HTTPS origin — replace with verified value.
UPSTREAM_BASE_URL = "https://tooniboy.xyz"
AES_KEY = ""
# Exact authorized website origins, comma-separated.
ALLOWED_ORIGINS = "https://watchoanime.pages.dev,http://localhost:8080,http://127.0.0.1:8080"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "18112010"

[ratelimits.simple]
limit = 120
period = 60

[observability]
enabled = true
head_sampling_rate = 1
